<style>
body { margin: 0; font-family: inherit; }
select, input { background: inherit; color: inherit; border: none; border-bottom: 1px solid; padding: .35em; }
.record-row { display: grid; grid-template-columns: 2fr 1fr 2fr 1fr auto; gap: .7em; margin: .7em 0; }
.buttons { display: flex; gap: .4em; }
.button { border: 1px solid; border-radius: 50%; width: 1.5em; height: 1.5em; text-align: center; cursor: pointer; line-height: 1.4em; }
#status { color: #ffb3b3; font-size: .85em; margin: .7em 0; white-space: pre-wrap; }
</style>
<label>DNS Server <select id="dns_server" onchange="monkshu_env.components['dns-records'].loadRecords(this)"><option value="">Select DNS server</option>{{#dnsServers}}<option value="{{value}}">{{label}}</option>{{/dnsServers}}</select></label>
<div id="status"></div>
<div id="records"></div>
<template><div class="record-row"><input class="name" placeholder="Host / domain"><select class="type"><option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option><option>TXT</option><option>NS</option><option>SRV</option></select><input class="value" placeholder="IP / value"><input class="ttl" type="number" min="0" placeholder="TTL"><span class="buttons"><span class="button" onclick="monkshu_env.components['dns-records'].addRow(this)">+</span><span class="button" onclick="monkshu_env.components['dns-records'].removeRow(this)">−</span></span></div></template>
